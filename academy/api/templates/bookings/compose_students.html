<div>
    <div class="text-center">
        <h4>Students who will receive this email</h4>
    </div>
</div>
<table class="table table-bordered bg-white" style="font-size: 13px;">
    <thead>
      <tr>
        <th>#</th> 
        <th>Student</th> 
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
		    <td>{{ loop.index }}</td>
            <td>{{student.fullName}}</td>
            <td>{{student.email}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
